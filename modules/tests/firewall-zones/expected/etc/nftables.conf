table inet wrath
flush table inet wrath
table inet wrath {
  chain input {
    type filter hook input priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iif lo accept
    icmp type { destination-unreachable, time-exceeded, parameter-problem, echo-request } accept
    icmpv6 type { destination-unreachable, packet-too-big, time-exceeded, parameter-problem, nd-router-solicit, nd-router-advert, nd-neighbor-solicit, nd-neighbor-advert, echo-request } accept
    ip6 daddr fe80::/64 udp sport 547 udp dport 546 accept
    tcp dport 22 accept
    iifname "external" tcp dport { 80, 443 } accept
    iifname "br*" ip saddr { 10.0.0.0/8 } tcp dport { 2379, 2380, 6443, 30000-32767 } accept
    iifname "br*" ip saddr { 10.0.0.0/8 } udp dport 8472 accept
    iifname "br*" ip6 saddr { 2001:db8:100::/56 } tcp dport { 2379, 2380, 6443, 30000-32767 } accept
    iifname "br*" ip6 saddr { 2001:db8:100::/56 } udp dport 8472 accept
    iifname "internal" ip saddr { 10.0.0.0/8 } tcp dport { 2379, 2380, 6443, 30000-32767 } accept
    iifname "internal" ip saddr { 10.0.0.0/8 } udp dport 8472 accept
    iifname "internal" ip6 saddr { 2001:db8:100::/56 } tcp dport { 2379, 2380, 6443, 30000-32767 } accept
    iifname "internal" ip6 saddr { 2001:db8:100::/56 } udp dport 8472 accept
  }
  chain forward {
    type filter hook forward priority 0; policy drop;
    ct state established,related accept
    ct state invalid drop
    iifname "br*" oifname "external" accept
    iifname "internal" oifname "external" accept
  }
  chain clamp {
    type filter hook forward priority mangle; policy accept;
    oifname "external" meta nfproto ipv4 tcp flags & (syn | rst) == syn tcp option maxseg size set 1460
    oifname "external" meta nfproto ipv6 tcp flags & (syn | rst) == syn tcp option maxseg size set 1440
  }
  chain spoofed {
    type filter hook prerouting priority raw; policy accept;
    iifname "external" ip saddr { 0.0.0.0/8, 10.0.0.0/8, 100.64.0.0/10, 127.0.0.0/8, 169.254.0.0/16, 172.16.0.0/12, 192.0.0.0/24, 192.0.2.0/24, 192.168.0.0/16, 198.18.0.0/15, 198.51.100.0/24, 203.0.113.0/24, 224.0.0.0/4, 240.0.0.0/4 } drop
    iifname "external" ip6 saddr { ::/128, ::1/128, ::ffff:0:0/96, 100::/64, 2001:db8::/32, 3fff::/20, fc00::/7, ff00::/8 } drop
  }
}
include "/etc/nftables.d/inet-prefilter.nft"
