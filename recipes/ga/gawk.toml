[[package]]
id = "gawk"
version = "5.3.2"
scope = "runtime"
toolchain = "compilers"
sources = [{ url = "https://ftp.gnu.org/gnu/gawk/gawk-{version}.tar.xz" }]
script = '''
./configure --prefix=$PREFIX --disable-nls
make -j$NPROC
make install DESTDIR=$DEST
'''
smoke = ["bin/gawk --version"]
check_in_view = true
check = "mkdir -p /build/locale; localedef -i en_US -f UTF-8 /build/locale/en_US.UTF-8; localedef -i C -f UTF-8 /build/locale/C.UTF-8; export LOCPATH=/build/locale; PAGER=cat make -j$NPROC check"
