[[package]]
id = "nftables"
version = "1.1.3"
scope = "runtime"
core = true
extra_deps = ["libnftnl", "pkgconf"]
sources = [{ url = "https://www.netfilter.org/pub/nftables/nftables-{version}.tar.xz" }]
smoke = ["bin/nft --version"]

[package.autotools]
args = [
    "--sbindir=$PREFIX/bin", "--disable-static", "--disable-man-doc", "--with-mini-gmp",
    "--without-cli", "--without-xtables", "--with-json=no",
]
