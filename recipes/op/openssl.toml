[[package]]
id = "openssl"
version = "3.5.2"
scope = "runtime"
toolchain = "compilers"
deps = ["perl", "zlib"]
sources = [{ url = "https://github.com/openssl/openssl/releases/download/openssl-{version}/openssl-{version}.tar.gz" }]
script = '''
./config --prefix=$PREFIX --openssldir=$PREFIX/etc/ssl --libdir=lib shared zlib-dynamic
make -j$NPROC
make install_sw install_ssldirs DESTDIR=$DEST
# The library names this directory, and these Perl scripts would take perl along with it.
rm -r $DEST$PREFIX/etc/ssl/misc
'''
smoke = ["bin/openssl version -a", "bin/openssl dgst -sha256 /proc/self/status"]
check = "make -j$NPROC test HARNESS_JOBS=$NPROC TESTS='-test_afalg'"
