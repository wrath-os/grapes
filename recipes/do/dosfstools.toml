[[package]]
id = "dosfstools"
version = "4.2"
scope = "runtime"
sources = [{ url = "https://github.com/dosfstools/dosfstools/releases/download/v{version}/dosfstools-{version}.tar.gz" }]
smoke = ["bin/mkfs.vfat --help"]

[package.autotools]
args = ["--sbindir=$PREFIX/bin", "--enable-compat-symlinks", "--without-udev"]
