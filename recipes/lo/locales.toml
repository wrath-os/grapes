[[package]]
id = "locales"
scope = "runtime"
core = true
script = '''
# Each locale compiled into a directory of its own for glibc to find through LOCPATH.
mkdir -p $DEST$PREFIX/lib/locale
for entry in $OPTION_locales; do
    name=${entry%/*}
    charset=${entry#*/}
    input=${name%%.*}
    localedef --no-archive -i "${input%%@*}" -f "$charset" "$DEST$PREFIX/lib/locale/$name"
    test -s "$DEST$PREFIX/lib/locale/$name/LC_CTYPE"
done
'''

[package.options.locales]
type = "list"
default = ["C.UTF-8/UTF-8"]
doc = "The locales to build, each a name and its character set, such as `en_US.UTF-8/UTF-8`."
