# wrath itself, from the wrath checkout building it, and the agent the VM tests drive a system
# through.

[[package]]
id = "wrath"
scope = "runtime"
core = true
extra_deps = ["rust-bin"]
sources = [{ url = "tree:@wrath", include = ["Cargo.toml", "Cargo.lock", "crates"] }]
smoke = ["bin/wrath --version", "bin/wrath-agent --help"]

[package.cargo]
packages = ["wrath-cli", "wrath-agent"]
programs = ["wrath", "wrath-agent"]
install = '''
mkdir -p $DEST$PREFIX/share/wrath $DEST$PREFIX/lib/systemd/system
cat > $DEST$PREFIX/lib/systemd/system/wrath-agent.service <<UNIT
[Unit]
Description=wrath test harness agent
# A switch it runs would end with it.
X-RestartIfChanged=false

[Service]
Environment=PATH=/run/wrappers/bin:/run/system/bin
ExecStart=$PREFIX/bin/wrath-agent
Restart=always
UNIT
'''

# grapes itself, as every system carries it: the set the system was built from, which wrath on
# the machine evaluates its configuration with while the lock pins this version.
[[package]]
id = "grapes"
scope = "runtime"
core = true
whole = true
sources = [{ url = "tree:.", include = ["set.toml", "platform.toml", "seed.pin", "sources.lock", "recipes", "styles", "modules"] }]
script = '''
mkdir -p $DEST$PREFIX
cp -r set.toml platform.toml seed.pin sources.lock recipes styles modules $DEST$PREFIX/
'''
smoke = ["test -s set.toml", "test -d modules"]
