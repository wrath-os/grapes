# The compiler as its project ships it, one static program with its standard library beside it,
# which it finds from where it runs.
[[package]]
id = "zig-bin"
version = "0.17.1"
scope = "runtime"
whole = true
sources = [{ url = "https://ziglang.org/download/{version}/zig-{arch}-{os}-{version}.tar.xz" }]
script = '''
mkdir -p $DEST$PREFIX/lib/zig $DEST$PREFIX/bin
cp -r zig lib $DEST$PREFIX/lib/zig/
ln -s ../lib/zig/zig $DEST$PREFIX/bin/zig
'''
smoke = ["bin/zig version"]
