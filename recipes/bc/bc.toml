[[package]]
id = "bc"
version = "7.0.3"
scope = "runtime"
core = true
sources = [{ url = "https://github.com/gavinhoward/bc/releases/download/{version}/bc-{version}.tar.xz" }]
smoke = ["bin/bc --version"]
check = "make test"

[package.autotools]
args = ["-G", "-O3", "-r"]
env = { CC = "'gcc -std=c99'" }
