[[package]]
id = "sqlite"
version = "3.54.1"
scope = "runtime"
core = true
extra_deps = ["readline", "zlib"]
sources = [{ url = "https://sqlite.org/2026/sqlite-autoconf-3540100.tar.gz" }]
probes = ["sqlite3"]
smoke = ["bin/sqlite3 --version"]

[package.autotools]
# Without `--soname=legacy` the library has no SONAME, and what links it records the build's
# `/usr/lib/libsqlite3.so` instead of its name.
args = ["--disable-static", "--soname=legacy"]
