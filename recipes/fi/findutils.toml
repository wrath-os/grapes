[[package]]
id = "findutils"
version = "4.10.0"
scope = "runtime"
toolchain = "compilers"
sources = [{ url = "https://ftp.gnu.org/gnu/findutils/findutils-{version}.tar.xz" }]
script = '''
./configure --prefix=$PREFIX --disable-nls --localstatedir=/var/lib/locate
make -j$NPROC
make install DESTDIR=$DEST
'''
smoke = ["bin/find --version", "bin/xargs --version"]
check_build = "make -j$NPROC check TESTS="
check = "make -j$NPROC check"
