[[package]]
id = "shared-mime-info"
version = "2.5.1"
scope = "runtime"
deps = ["meson", "ninja", "pkgconf", "glib", "libxml2", "gettext"]
# The MIME database is made from every package's types with each generation.
indexes = [{ from = "share/mime", run = "bin/update-mime-database share/mime" }]
sources = [{ url = "https://gitlab.freedesktop.org/xdg/shared-mime-info/-/archive/{version}/shared-mime-info-{version}.tar.gz" }]
smoke = ["bin/update-mime-database -v"]

# What kinds of file there are, by name and contents, which file choosers and openers ask.
[package.meson]
args = [
  "-D update-mimedb=false", "-D build-tests=false", "-D build-translations=false",
  "-D build-spec=false",
]
