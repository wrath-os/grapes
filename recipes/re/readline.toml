[[package]]
id = "readline"
version = "8.3"
scope = "runtime"
toolset = true
extra_deps = ["ncurses"]
sources = [{ url = "https://ftp.gnu.org/gnu/readline/readline-{version}.tar.gz" }]
script = '''
sed -i '/MV.*old/d' Makefile.in
sed -i '/{OLDSUFF}/c:' support/shlib-install
./configure --prefix=$PREFIX --disable-static --with-curses
make -j$NPROC SHLIB_LIBS="-lncursesw"
make SHLIB_LIBS="-lncursesw" install DESTDIR=$DEST
'''
probes = ["readline"]
