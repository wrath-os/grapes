[[package]]
id = "pcre2"
version = "10.45"
scope = "runtime"
deps = ["zlib", "bzip2"]
sources = [{ url = "https://github.com/PCRE2Project/pcre2/releases/download/pcre2-{version}/pcre2-{version}.tar.bz2" }]
smoke = ["bin/pcre2grep --version"]
check_build = "make -j$NPROC check TESTS="
check = "make -j$NPROC check"
check_in_view = true

[package.autotools]
args = [
    "--disable-static", "--enable-unicode", "--enable-pcre2-16", "--enable-pcre2-32",
    "--enable-pcre2grep-libz", "--enable-pcre2grep-libbz2",
]
