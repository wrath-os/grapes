[[package]]
id = "gdk-pixbuf-gir"
version = "2.44.8"
scope = "runtime"
core = true
extra_deps = [
  "meson", "ninja", "pkgconf", "python3", "glib", "libpng", "gobject-introspection",
  "setuptools", "glib-gir",
]
sources = [{ url = "https://download.gnome.org/sources/gdk-pixbuf/{series}/gdk-pixbuf-{version}.tar.xz" }]

[package.meson]
args = [
  "-D png=enabled", "-D jpeg=disabled", "-D tiff=disabled", "-D gif=disabled",
  "-D others=disabled", "-D glycin=disabled", "-D builtin_loaders=png",
  "-D introspection=enabled", "-D documentation=false", "-D man=false", "-D tests=false",
  "-D installed_tests=false", "-D thumbnailer=disabled", "-D gio_sniffing=false",
]
keep = ["share/gir-1.0", "lib/girepository-1.0"]
