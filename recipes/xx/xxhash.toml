[[package]]
id = "xxhash"
version = "0.8.4"
scope = "runtime"
sources = [{ url = "https://github.com/Cyan4973/xxHash/archive/v{version}/xxHash-{version}.tar.gz" }]
smoke = ["bin/xxhsum -V"]
script = '''
# Fast hashes, which zathura names the files it remembers by.
make -j$NPROC PREFIX=$PREFIX
make install PREFIX=$PREFIX DESTDIR=$DEST
rm $DEST$PREFIX/lib/libxxhash.a
'''
