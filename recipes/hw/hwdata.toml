[[package]]
id = "hwdata"
version = "0.413"
scope = "runtime"
sources = [{ url = "https://github.com/vcrhonek/hwdata/archive/v{version}/hwdata-{version}.tar.gz" }]
script = '''
# The names of hardware vendors and devices, which libdisplay-info reads monitors' makers from.
./configure --prefix=$PREFIX --datadir=$PREFIX/share --disable-blacklist
make install DESTDIR=$DEST
'''
