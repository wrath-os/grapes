[[package]]
id = "pkgconf"
version = "2.5.1"
scope = "runtime"
core = true
sources = [{ url = "https://distfiles.ariadne.space/pkgconf/pkgconf-{version}.tar.xz" }]
script = '''
./configure --prefix=$PREFIX --disable-static --with-pkg-config-dir=/usr/lib/pkgconfig:/usr/share/pkgconfig
make -j$NPROC
make install DESTDIR=$DEST
ln -s pkgconf $DEST$PREFIX/bin/pkg-config
'''
smoke = ["bin/pkgconf --version"]
