[[package]]
id = "attr"
version = "2.5.2"
scope = "runtime"
sources = [{ url = "https://download.savannah.gnu.org/releases/attr/attr-{version}.tar.gz" }]
smoke = ["bin/getfattr --version"]
check_in_view = true
check = "make -j$NPROC check"
check_deps = ["perl"]

[package.autotools]
args = ["--disable-static", "--disable-nls", "--sysconfdir=$PREFIX/etc"]
