[[package]]
id = "at-spi2-core"
version = "2.60.7"
scope = "runtime"
core = true
extra_deps = [
  "meson", "ninja", "pkgconf", "python3", "glib", "dbus",
  "libxml2",
]
sources = [{ url = "https://download.gnome.org/sources/at-spi2-core/{series}/at-spi2-core-{version}.tar.xz" }]
probes = ["atk", "atk-bridge-2.0"]

# The accessibility bus and its libraries, ATK among them, without X.
[package.meson]
args = [
  "-D x11=disabled", "-D introspection=disabled", "-D docs=false", "-D use_systemd=true",
  "-D systemd_user_dir=$PREFIX/lib/systemd/user",
]
