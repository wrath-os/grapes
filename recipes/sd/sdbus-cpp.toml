# C++ bindings to sd-bus, which Noctalia talks to services with.
[[package]]
id = "sdbus-cpp"
version = "2.3.1"
scope = "runtime"
deps = ["systemd"]
sources = [{ url = "https://github.com/Kistler-Group/sdbus-cpp/archive/v{version}/sdbus-cpp-{version}.tar.gz" }]

[package.cmake]
args = ["-DSDBUSCPP_BUILD_DOCS=OFF", "-DSDBUSCPP_BUILD_TESTS=OFF", "-DBUILD_SHARED_LIBS=ON"]
