[[package]]
id = "nerd-fonts-iosevka"
version = "3.5.1"
scope = "runtime"
sources = [{ url = "https://github.com/ryanoasis/nerd-fonts/releases/download/v{version}/Iosevka.tar.xz" }]
script = '''
mkdir -p $DEST$PREFIX/share/fonts/nerd-fonts-iosevka
find . -name "*.ttf" -o -name "*.otf" | xargs cp -t $DEST$PREFIX/share/fonts/nerd-fonts-iosevka/
'''

