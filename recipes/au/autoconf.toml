[[package]]
id = "autoconf"
version = "2.72"
scope = "runtime"
core = true
extra_deps = ["m4-final", "perl"]
propagates = ["m4-final"]
sources = [{ url = "https://ftp.gnu.org/gnu/autoconf/autoconf-{version}.tar.xz" }]
smoke = ["bin/autoconf --version"]
check_in_view = true
check = "make -j$NPROC check"

[package.autotools]
