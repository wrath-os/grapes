[[package]]
id = "gsettings-desktop-schemas"
version = "51.0"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "glib"]
sources = [{ url = "https://download.gnome.org/sources/gsettings-desktop-schemas/{series}/gsettings-desktop-schemas-{version}.tar.xz" }]

[package.meson]
args = ["-D introspection=false"]
install = '''
# The compiled schemas are made for a whole system, from every package's.
rm $DEST$PREFIX/share/glib-2.0/schemas/gschemas.compiled
'''
