[[package]]
id = "nushell"
version = "0.117.0"
scope = "runtime"
core = true
extra_deps = ["pkgconf", "openssl"]
sources = [{ url = "https://github.com/nushell/nushell/archive/{version}/nushell-{version}.tar.gz" }]
smoke = ["bin/nu --version", "bin/nu -c '1 + 1'"]

[package.cargo]
packages = ["nu"]
programs = ["nu"]
