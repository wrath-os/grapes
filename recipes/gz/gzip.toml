[[package]]
id = "gzip"
version = "1.14"
scope = "runtime"
toolset = true
sources = [{ url = "https://ftp.gnu.org/gnu/gzip/gzip-{version}.tar.xz" }]
script = '''
./configure --prefix=$PREFIX
make -j$NPROC
make install DESTDIR=$DEST
'''
smoke = ["bin/gzip --version"]
check_build = "make -j$NPROC check TESTS="
check = "make -j$NPROC check"
