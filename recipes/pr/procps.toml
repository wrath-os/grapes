[[package]]
id = "procps"
version = "4.0.5"
scope = "runtime"
deps = ["pkgconf", "ncurses"]
sources = [{ url = "https://sourceforge.net/projects/procps-ng/files/Production/procps-ng-{version}.tar.xz/download" }]
smoke = ["bin/ps --version"]

[package.autotools]
args = ["--disable-static", "--disable-nls", "--disable-kill", "--without-systemd"]
cflags = ["-include", "stdbool.h"]
