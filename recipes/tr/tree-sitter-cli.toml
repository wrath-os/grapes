[[package]]
id = "tree-sitter-cli"
version = "0.27.2"
scope = "runtime"
core = true
sources = [{ url = "https://github.com/tree-sitter/tree-sitter/archive/v{version}/tree-sitter-{version}.tar.gz" }]
smoke = ["bin/tree-sitter --version"]

[package.cargo]
packages = ["tree-sitter-cli"]
programs = ["tree-sitter"]
