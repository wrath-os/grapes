[[package]]
id = "smartmontools"
version = "7.5"
scope = "runtime"
sources = [{ url = "https://github.com/smartmontools/smartmontools/releases/download/RELEASE_7_5/smartmontools-{version}.tar.gz" }]
smoke = ["sbin/smartctl --version"]

[package.autotools]
args = ["--with-systemdsystemunitdir=no", "--without-libcap-ng", "--sysconfdir=/etc"]
