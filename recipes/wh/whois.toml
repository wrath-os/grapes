[[package]]
id = "whois"
version = "5.6.6"
scope = "runtime"
deps = ["perl"]
sources = [{ url = "https://deb.debian.org/debian/pool/main/w/whois/whois_{version}.tar.xz" }]
script = '''
make -j$NPROC whois HAVE_ICONV=1
install -Dm755 whois $DEST$PREFIX/bin/whois
'''
smoke = ["bin/whois --version"]

