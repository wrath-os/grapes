[[package]]
id = "mtr"
version = "0.96"
scope = "runtime"
core = true
extra_deps = ["ncurses", "autoconf", "automake", "pkgconf"]
sources = [{ url = "https://github.com/traviscross/mtr/archive/v{version}/mtr-{version}.tar.gz" }]
smoke = ["sbin/mtr --version"]

# The archive has no configure; its own script makes it.
[package.autotools]
args = ["--without-gtk"]
prepare = "./bootstrap.sh"
