[[package]]
id = "systemd"
version = "257.8"
scope = "runtime"
deps = [
    "meson", "ninja", "python3", "markupsafe", "jinja2", "pyelftools", "pkgconf", "gperf", "libcap",
    "libxcrypt", "acl", "kmod", "lz4", "kbd", "gettext", "m4-final",
    "linux-pam", "cryptsetup", "tpm2-tss",
]
sources = [{ url = "https://github.com/systemd/systemd/archive/v{version}/systemd-{version}.tar.gz" }]
smoke = ["bin/systemctl --version", "lib/systemd/systemd --version", "bin/udevadm --version",
    "bin/systemd-repart --version", "lib/systemd/systemd-cryptsetup --version"]

[package.meson]
args = [
    "--auto-features=disabled", "--sysconfdir=/etc", "--localstatedir=/var",
    "-D c_link_args=-Wl,-rpath,$PREFIX/lib/systemd",
    "-D mode=release", "-D man=disabled", "-D html=disabled", "-D install-tests=false",
    "-D tests=false", "-D bootloader=enabled", "-D sbat-distro=", "-D acl=enabled",
    "-D kmod=enabled", "-D blkid=enabled", "-D xz=enabled", "-D lz4=enabled", "-D zstd=enabled",
    "-D openssl=enabled", "-D libcryptsetup=enabled", "-D fdisk=enabled", "-D repart=enabled",
    "-D pam=enabled", "-D sysusers=true", "-D tpm2=enabled", "-D firstboot=false",
    "-D homed=disabled", "-D userdb=false", "-D sysupdate=disabled", "-D ukify=disabled",
    "-D ldconfig=false", "-D rpmmacrosdir=no", "-D pamconfdir=no", "-D bashcompletiondir=no",
    "-D zshcompletiondir=no", "-D default-dnssec=no", "-D dev-kvm-mode=0660",
    "-D nobody-group=nogroup", "-D create-log-dirs=false", "-D install-sysconfdir=false",
    "-D mount-path=$WRATH_DEP_util_linux/bin/mount",
    "-D umount-path=$WRATH_DEP_util_linux/bin/umount",
    "-D sulogin-path=$WRATH_DEP_util_linux/bin/sulogin", "-D kmod-path=$WRATH_DEP_kmod/bin/kmod",
    "-D loadkeys-path=$WRATH_DEP_kbd/bin/loadkeys", "-D setfont-path=$WRATH_DEP_kbd/bin/setfont",
    "-D nologin-path=$WRATH_DEP_coreutils/bin/false",
]
prepare = '''
# Swap units run swapon and swapoff from a fixed path, which a system without /sbin lacks.
sed -i "s#\"/sbin/swapon\"#\"$WRATH_DEP_util_linux/bin/swapon\"#; s#\"/sbin/swapoff\"#\"$WRATH_DEP_util_linux/bin/swapoff\"#" \
    src/core/swap.c
# Units from packages name programs without a path, such as `ExecStart=niri`, and systemd looks
# them up in its own list of directories, never in PATH. A system's programs are in /run/system/bin.
sed -i 's|^#define DEFAULT_PATH_WITH\(OUT\)\?_SBIN |&"/run/wrath/wrappers/bin:/run/system/bin:" |' \
    src/basic/path-util.h
'''
install = '''
# Units name helpers bare, and systemd looks those up in a compiled-in /usr/bin.
for unit in $(grep -rlE '^Exec[A-Za-z]*=[-@:+!]*[a-z]' $DEST$PREFIX/lib/systemd --include='*.service'); do
    for name in $(ls $DEST$PREFIX/bin); do
        sed -Ei "s#^(Exec[A-Za-z]*=[-@:+!]*)$name( |\$)#\1$PREFIX/bin/$name\2#" $unit
    done
    sed -Ei "s#^(Exec[A-Za-z]*=[-@:+!]*)rm( |\$)#\1$WRATH_DEP_coreutils/bin/rm\2#" $unit
done
sed -i "s#/sbin/agetty#$WRATH_DEP_util_linux/bin/agetty#" $DEST$PREFIX/lib/systemd/system/*getty*.service
# kmod is modprobe by the name it's called; `@` gives a program the name to run as.
sed -i "s#^ExecStart=-/sbin/modprobe #ExecStart=-@$WRATH_DEP_kmod/bin/kmod modprobe #" \
    $DEST$PREFIX/lib/systemd/system/modprobe@.service
# glibc finds NSS modules from other packages in the system's lib/nss.
mkdir -p $DEST$PREFIX/lib/nss
for module in $DEST$PREFIX/lib/libnss_*.so.2; do
    ln -s ../${module##*/} $DEST$PREFIX/lib/nss/
done
'''
