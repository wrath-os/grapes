[[package]]
id = "highway"
version = "1.4.0"
scope = "runtime"
core = true
sources = [{ url = "https://github.com/google/highway/archive/{version}/highway-{version}.tar.gz" }]
probes = ["hwy"]

[package.cmake]
args = [
  "-DBUILD_SHARED_LIBS=ON", "-DBUILD_TESTING=OFF", "-DHWY_ENABLE_TESTS=OFF",
  "-DHWY_ENABLE_EXAMPLES=OFF", "-DHWY_ENABLE_CONTRIB=OFF",
]
