[[package]]
id = "gitui"
version = "0.28.1"
scope = "runtime"
sources = [{ url = "https://github.com/gitui-org/gitui/archive/v{version}/gitui-{version}.tar.gz" }]
smoke = ["bin/gitui --version"]

[package.cargo]
packages = ["gitui"]
# Its build script asks git for a commit, which a release archive has no history for.
env = { BUILD_GIT_COMMIT_ID = "release", GITUI_RELEASE = "1" }
