[[package]]
id = "tailscale"
version = "1.86.2"
scope = "runtime"
deps = ["go"]
sources = [{ url = "https://github.com/tailscale/tailscale/archive/v{version}/tailscale-{version}.tar.gz" }]
smoke = ["bin/tailscale version", "bin/tailscaled --version"]

[package.go]
packages = ["./cmd/tailscale", "./cmd/tailscaled"]
ldflags = "-X tailscale.com/version.longStamp=1.86.2 -X tailscale.com/version.shortStamp=1.86.2"
