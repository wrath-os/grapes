[[package]]
id = "gettext"
version = "0.26"
scope = "runtime"
deps = ["ncurses", "libxml2", "expat"]
sources = [{ url = "https://ftp.gnu.org/gnu/gettext/gettext-{version}.tar.xz" }]
smoke = ["bin/gettext --version", "bin/msgfmt --version"]
check_in_view = true
check = "make -j$NPROC check"

[package.autotools]
args = ["--disable-static", "--disable-java", "--without-emacs"]
