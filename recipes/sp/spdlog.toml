[[package]]
id = "spdlog"
version = "1.17.0"
scope = "runtime"
deps = ["fmt"]
propagates = ["fmt"]
sources = [{ url = "https://github.com/gabime/spdlog/archive/v{version}/spdlog-{version}.tar.gz" }]

# Logging for C++, with the fmt above instead of a copy of its own.
[package.cmake]
args = [
  "-D SPDLOG_BUILD_SHARED=ON", "-D SPDLOG_FMT_EXTERNAL=ON", "-D SPDLOG_BUILD_EXAMPLE=OFF",
  "-D SPDLOG_BUILD_TESTS=OFF", "-D CMAKE_INSTALL_LIBDIR=lib",
]
