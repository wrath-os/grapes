[[package]]
id = "vim"
version = "9.2.1332"
scope = "runtime"
core = true
extra_deps = ["ncurses"]
sources = [{ url = "https://github.com/vim/vim/archive/v{version}/vim-{version}.tar.gz" }]
smoke = ["bin/vim --version"]

[package.autotools]
args = [
  "--with-features=huge", "--enable-multibyte", "--disable-gui", "--without-x",
  "--with-tlib=ncursesw", "--disable-nls",
]
