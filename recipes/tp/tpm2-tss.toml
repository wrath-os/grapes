[[package]]
id = "tpm2-tss"
version = "4.2.1"
scope = "runtime"
deps = ["openssl", "pkgconf"]
sources = [{ url = "https://github.com/tpm2-software/tpm2-tss/releases/download/{version}/tpm2-tss-{version}.tar.gz" }]

# The libraries systemd talks to the TPM through, to unlock disks with it. The feature API and
# policy library need a JSON parser and a web client, and systemd uses neither.
[package.autotools]
args = [
    "--disable-static", "--disable-fapi", "--disable-policy", "--disable-doxygen-doc",
    "--disable-unit", "--disable-integration", "--disable-tcti-libtpms",
    "--disable-tcti-spi-helper", "--disable-tcti-spi-ltt2go", "--disable-tcti-spi-ftdi",
    "--disable-tcti-i2c-helper", "--disable-tcti-i2c-ftdi",
    "--with-udevrulesdir=$PREFIX/lib/udev/rules.d", "--with-sysusersdir=$PREFIX/lib/sysusers.d",
    "--with-tmpfilesdir=$PREFIX/lib/tmpfiles.d", "--with-runstatedir=/run",
    "--sysconfdir=$PREFIX/etc",
]
