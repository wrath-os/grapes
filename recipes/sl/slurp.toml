[[package]]
id = "slurp"
version = "1.5.0"
scope = "runtime"
deps = ["cairo", "libxkbcommon", "wayland", "wayland-protocols"]
sources = [{ url = "https://github.com/emersion/slurp/releases/download/v{version}/slurp-{version}.tar.gz" }]
smoke = ["bin/slurp -h"]

[package.meson]
args = ["-D man-pages=disabled"]
