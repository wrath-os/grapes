[[package]]
id = "libffi"
version = "3.5.2"
scope = "runtime"
toolchain = "compilers"
# What gcc's -march calls each target's baseline, so libffi doesn't tune for the build machine.
arch_names = { x86_64 = "x86-64", aarch64 = "armv8-a" }
sources = [{ url = "https://github.com/libffi/libffi/releases/download/v{version}/libffi-{version}.tar.gz" }]
script = '''
./configure --prefix=$PREFIX --disable-static --with-gcc-arch=$WRATH_ARCH_NAME
make -j$NPROC
make install DESTDIR=$DEST
'''
