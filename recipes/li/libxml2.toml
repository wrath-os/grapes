[[package]]
id = "libxml2"
version = "2.14.5"
scope = "runtime"
toolchain = "compilers"
deps = ["zlib", "xz"]
sources = [{ url = "https://download.gnome.org/sources/libxml2/{series}/libxml2-{version}.tar.xz" }]
script = '''
./configure --prefix=$PREFIX --disable-static --without-python --with-history=no
make -j$NPROC
make install DESTDIR=$DEST
'''
smoke = ["bin/xmllint --version"]
check_build = "make -j$NPROC check TESTS="
check = "make -j$NPROC check"
