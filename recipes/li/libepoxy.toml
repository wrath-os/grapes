[[package]]
id = "libepoxy"
version = "1.5.10"
scope = "runtime"
core = true
extra_deps = ["meson", "ninja", "pkgconf", "python3", "mesa", "libX11"]
sources = [{ url = "https://github.com/anholt/libepoxy/archive/{version}/libepoxy-{version}.tar.gz" }]
probes = ["epoxy"]

# OpenGL function loading over EGL, and GLX for GTK 3's X11 backend, which loads libGL only if a
# program draws through it.
[package.meson]
args = ["-D glx=yes", "-D x11=true", "-D egl=yes", "-D tests=false", "-D docs=false"]
