[[package]]
id = "libgcrypt"
version = "1.12.4"
scope = "runtime"
core = true
extra_deps = ["libgpg-error"]
sources = [{ url = "https://gnupg.org/ftp/gcrypt/libgcrypt/libgcrypt-{version}.tar.bz2" }]
probes = ["libgcrypt"]

[package.autotools]
args = [
  "--disable-static", "--disable-doc", "--with-libgpg-error-prefix=$WRATH_DEP_libgpg_error",
]
