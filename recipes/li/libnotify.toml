[[package]]
id = "libnotify"
version = "0.8.9"
scope = "runtime"
deps = ["gdk-pixbuf"]
sources = [{ url = "https://download.gnome.org/sources/libnotify/{series}/libnotify-{version}.tar.xz" }]
smoke = ["bin/notify-send --version"]

# Desktop notifications, and notify-send to show one from a shell.
[package.meson]
args = [
  "-D tests=false", "-D introspection=disabled", "-D man=false", "-D gtk_doc=false",
  "-D docbook_docs=disabled",
]

# Programs.
