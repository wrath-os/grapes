# YAML, as AppStream reads its catalogs in.
[[package]]
id = "libfyaml"
version = "0.9.3"
scope = "runtime"
deps = ["cmake", "ninja"]
sources = [{ url = "https://github.com/pantoniou/libfyaml/archive/v{version}/libfyaml-{version}.tar.gz" }]

[package.cmake]
args = ["-D BUILD_SHARED_LIBS=ON", "-D BUILD_TESTING=OFF"]
