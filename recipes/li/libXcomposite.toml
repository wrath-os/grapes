[[package]]
id = "libXcomposite"
version = "0.4.7"
scope = "runtime"
core = true
extra_deps = ["pkgconf", "xorgproto", "libX11", "libXfixes"]
sources = [{ url = "https://www.x.org/archive/individual/lib/libXcomposite-{version}.tar.xz" }]
probes = ["xcomposite"]

[package.autotools]
args = ["--disable-static", "--without-xmlto"]
