[[package]]
id = "libwebp"
version = "1.6.0"
scope = "runtime"
core = true
extra_deps = ["libpng"]
sources = [{ url = "https://storage.googleapis.com/downloads.webmproject.org/releases/webp/libwebp-{version}.tar.gz" }]
probes = ["webp", "webpdemux"]

[package.autotools]
args = ["--disable-static", "--enable-libwebpdemux"]
