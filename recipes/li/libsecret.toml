[[package]]
id = "libsecret"
version = "0.21.8"
scope = "runtime"
deps = ["glib", "libgcrypt"]
sources = [{ url = "https://download.gnome.org/sources/libsecret/{series}/libsecret-{version}.tar.xz" }]

# The client for a secret service such as GNOME Keyring.
[package.meson]
args = [
  "-D introspection=false", "-D vapi=false", "-D manpage=false", "-D gtk_doc=false",
  "-D crypto=libgcrypt", "-D bash_completion=disabled", "-D pam=false",
]
