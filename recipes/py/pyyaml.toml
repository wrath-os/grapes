[[package]]
id = "pyyaml"
version = "6.0.3"
scope = "runtime"
sources = [{ url = "https://files.pythonhosted.org/packages/source/p/pyyaml/pyyaml-{version}.tar.gz" }]
script = '''
# Only its pure Python part, which is all the build tools that read YAML need.
mkdir -p $DEST$PREFIX/site
cp -r lib/yaml $DEST$PREFIX/site/
'''
