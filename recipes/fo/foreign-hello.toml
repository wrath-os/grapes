[[package]]
id = "foreign-hello"
version = "1"
scope = "runtime"
wrap = false
files = ["foreign-hello.cc"]
script = '''
# For tests of running programs built elsewhere: no run path, and the usual loader.
mkdir -p $DEST$PREFIX/bin
g++ -O2 foreign-hello.cc -o $DEST$PREFIX/bin/foreign-hello \
    -Wl,--dynamic-linker=/lib64/$WRATH_LOADER_NAME
'''
