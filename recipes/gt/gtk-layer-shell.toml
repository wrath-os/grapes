[[package]]
id = "gtk-layer-shell"
version = "0.10.1"
scope = "runtime"
deps = ["gtk3", "wayland-protocols"]
sources = [{ url = "https://github.com/wmww/gtk-layer-shell/archive/v{version}/gtk-layer-shell-{version}.tar.gz" }]

# Puts a GTK 3 window on a layer of the screen, as bars and docks are.
[package.meson]
args = [
  "-D introspection=false", "-D vapi=false", "-D docs=false", "-D tests=false",
  "-D examples=false",
]
