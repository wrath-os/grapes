[[package]]
id = "gptfdisk"
version = "1.0.10"
scope = "runtime"
core = true
extra_deps = ["popt", "util-linux", "ncurses"]
sources = [{ url = "https://downloads.sourceforge.net/project/gptfdisk/gptfdisk/{version}/gptfdisk-{version}.tar.gz" }]
script = '''
# Our ncurses keeps its headers at the top, without an ncursesw directory.
sed -i "s|ncursesw/ncurses.h|ncurses.h|" gptcurses.cc
make -j$NPROC
install -Dm755 -t $DEST$PREFIX/bin gdisk sgdisk cgdisk fixparts
'''
smoke = ["bin/sgdisk --version"]

# The network.
