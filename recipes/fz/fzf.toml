[[package]]
id = "fzf"
version = "0.75.0"
scope = "runtime"
core = true
sources = [{ url = "https://github.com/junegunn/fzf/archive/v{version}/fzf-{version}.tar.gz" }]
smoke = ["bin/fzf --version", "sh: printf 'a\\nb\\n' | $OUT/bin/fzf --filter b"]

[package.go]
ldflags = "-X main.version=0.75.0 -X main.revision=release"
